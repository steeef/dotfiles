StylesPath = styles
MinAlertLevel = suggestion
Packages = write-good, Google

[*.md]
BasedOnStyles = write-good, Google
write-good.E-Prime = NO

# Tuned against thoughts/tatari corpus (431 docs): these Google rules fired
# almost entirely on genre mismatches (acronym-dense infra docs, internal
# first-person research voice, Title Case headings) rather than real defects.
Google.Acronyms = NO
Google.AMPM = NO
Google.Colons = NO
Google.Contractions = NO
Google.DateFormat = NO
Google.Ellipses = NO
Google.EmDash = NO
Google.Exclamation = NO
Google.FirstPerson = NO
Google.Gender = NO
Google.GenderBias = NO
Google.HeadingPunctuation = NO
Google.Headings = NO
Google.Jargon = NO
Google.Latin = NO
Google.LyHyphens = NO
Google.OptionalPlurals = NO
Google.Ordinal = NO
Google.OxfordComma = NO
Google.Parens = NO
Google.Passive = NO
Google.Periods = NO
Google.Quotes = NO
Google.Ranges = NO
Google.Semicolons = NO
Google.Slang = NO
Google.Spacing = NO
Google.Spelling = NO
Google.Timeless = NO
Google.Units = NO
Google.We = NO
Google.Will = NO
Google.WordList = NO
Google.WordListCase = NO
